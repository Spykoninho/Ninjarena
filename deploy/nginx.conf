# Le client est servi sous /ninjarena/ ; le reste du domaine n'appartient pas à cette app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Derrière Traefik, une redirection absolue reconstruirait une URL en http.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /ninjarena {
        return 301 /ninjarena/;
    }

    # Les bundles portent un hash dans leur nom: cache long, index.html reste revalidé.
    location /ninjarena/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ninjarena/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /ninjarena/index.html;
    }

    location / {
        return 404;
    }
}
